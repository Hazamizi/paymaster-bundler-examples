name: Paper bot smoke

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  smoke-paper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-onchainkit-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: my-onchainkit-app/package-lock.json
      - run: npm ci
      - run: npm run smoke:paper

  paper-7day:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-onchainkit-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: my-onchainkit-app/package-lock.json
      - run: npm ci
      # Short public-candle walk (ETH only) — exercises paper-book + strategy path
      - run: npm run paper:7day -- --days 1 --warmup 100 --products ETH-EUR
